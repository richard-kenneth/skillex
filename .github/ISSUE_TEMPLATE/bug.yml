name: Bug report
description: Report a reproducible problem in SkillEx
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Do not include secrets, `.env` contents, access tokens, passwords, or personal data.** For a security vulnerability, use [private vulnerability reporting](https://github.com/theskillex/skillex/security/advisories/new) instead of a public issue.

        Search [existing issues](https://github.com/theskillex/skillex/issues) first.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence describing the problem.
      placeholder: Saving a profile with an avatar returns 500
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - Web app (apps/web)
        - API (apps/api)
        - Mobile app (apps/mobile)
        - Shared package (packages/shared)
        - Documentation
        - Local setup, Docker, or dev container
        - Other or not sure
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: What happened?
      description: Describe the actual behavior, including the full error message if there is one.
      placeholder: The request returns 500 and the profile page shows "Something went wrong".
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest sequence that reliably reproduces the problem.
      placeholder: |
        1. Run `pnpm run setup` and `pnpm dev`
        2. Sign in as demo@skillex.dev
        3. Open Settings -> Profile
        4. Upload a PNG avatar and save
        5. See the 500 response
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag or commit SHA you are running. Use `git rev-parse --short HEAD` if unsure.
      placeholder: fb20283
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, Node and pnpm versions, browser or device, and how you run the project.
      placeholder: |
        OS: Windows 11
        Node: 22.x
        pnpm: 10.33.2
        Browser: Chrome 140
        Setup: local Docker Compose, `pnpm dev`
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste only the relevant lines. Remove secrets, tokens, email addresses, and other personal data first.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and discussions for this problem.
          required: true
        - label: I removed secrets, credentials, and personal data from this report.
          required: true
        - label: This is not a security vulnerability, or I have reported it privately instead.
          required: true
