name: Documentation issue
description: Report unclear, missing, or incorrect documentation
title: "[Docs]: "
labels: ["docs"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make SkillEx easier to understand. For a typo or a
        small correction, you can open a pull request directly.

        Do not include secrets, `.env` contents, or personal data in this issue.

  - type: input
    id: location
    attributes:
      label: Where is the problem?
      description: Link the page or give the repository path and section.
      placeholder: docs/env-vars.md, "Payments" section
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Describe what confused you, what is incorrect, or what cannot be found.
    validations:
      required: true

  - type: textarea
    id: suggested-change
    attributes:
      label: Suggested change
      description: If you have a specific wording or example in mind, include it here.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Documentation area
      options:
        - Setup and quick start
        - Environment variables
        - Architecture
        - Mobile development
        - Contributing, CLA, or community
        - Security or privacy
        - Deployment or self-hosting
        - API reference or examples
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues, screenshots, or the version you were using.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and discussions for this documentation problem.
          required: true
        - label: I did not include secrets, credentials, or personal data in this issue.
          required: true
