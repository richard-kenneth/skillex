version: 2

# Group routine dependency updates into a small number of weekly pull requests.
# Major updates stay separate so they can be reviewed on their own.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:45"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 3
    groups:
      devcontainers:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(devcontainer)"
      include: "scope"
