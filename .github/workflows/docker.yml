name: Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - apps/*/package.json
      - apps/mobile/modules/**
      - packages/*/package.json
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - apps/*/package.json
      - apps/mobile/modules/**
      - packages/*/package.json
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  build:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Build the deploy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: skillex-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image layout
        run: |
          docker run --rm --entrypoint sh skillex-api:ci -c '
            missing=0
            for path in \
              apps/api/dist/main.js \
              apps/api/prisma/schema.prisma \
              apps/api/scripts/start.sh \
              node_modules/@skillex/shared/dist/index.js \
              node_modules/@nestjs/core/package.json
            do
              if [ -e "$path" ]; then echo "ok      $path"; else echo "MISSING $path"; missing=1; fi
            done
            if [ "$missing" -ne 0 ]; then exit 1; fi
            node -e "require(\"@skillex/shared\"); require(\"@nestjs/core\"); console.log(\"modules load\")"
            if [ -d node_modules/typescript ]; then echo "note: typescript is present in the production image"; fi
            echo "image layout ok"
          '
