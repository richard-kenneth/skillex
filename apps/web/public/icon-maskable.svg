<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Full background for masking -->
  <rect width="512" height="512" fill="url(#bg-grad)"/>
  <!-- Scaled group to fit within PWA safe area (within 384x384 box centered at 256,256) -->
  <g transform="translate(141, 141) scale(0.85)" filter="url(#glow)">
    <!-- Brackets -->
    <path d="M 50 80 L 10 140 L 50 200" stroke="url(#primary-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 230 80 L 270 140 L 230 200" stroke="url(#primary-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Exchange Arrows -->
    <!-- Top Arrow (Left to Right) -->
    <path d="M 70 110 L 210 110" stroke="url(#primary-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 185 85 L 210 110 L 185 135" stroke="url(#primary-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Bottom Arrow (Right to Left) -->
    <path d="M 210 170 L 70 170" stroke="url(#primary-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 95 145 L 70 170 L 95 195" stroke="url(#primary-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
