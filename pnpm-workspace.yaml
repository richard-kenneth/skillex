packages:
  - "apps/*"
  - "packages/*"
overrides:
  chokidar: ^5.0.0
  react: 19.2.3
  react-dom: 19.2.3
  "@tanstack/react-query": 5.100.3
  # Keep the formatter version aligned with CI so formatting does not drift.
  prettier: 3.9.6
  # Security patches for transitive dependencies. These stay inside the major
  # version the dependents already use, so the runtime contract is unchanged.
  "@hono/node-server": 2.1.3
  "@modelcontextprotocol/sdk": 1.32.2
  "@xmldom/xmldom": 0.8.15
  body-parser: 2.4.0
  compression: 1.8.2
  deepmerge-ts: 8.0.2
  dompurify: 3.4.17
  fast-copy: 4.1.0
  fast-uri: 3.1.9
  follow-redirects: 1.16.3
  hono: 4.13.11
  ip-address: 10.7.4
  js-yaml: 4.3.2
  multer: 2.5.0
  mysql2: 3.24.6
  node-forge: 1.4.3
  postcss: 8.5.32
  postcss-selector-parser: 7.1.6
  proxy-addr: 2.0.8
  qs: 6.16.1
  sharp: 0.35.5
  shell-quote: 1.12.0
  source-map-js: 1.2.2
  systeminformation: 5.33.19
  undici: 7.30.1
  # flutterwave-react-v3 pins axios 0.21.x; stay on 0.x but pick up the
  # patched release so the payment widget is not flagged.
  "flutterwave-react-v3>axios": 0.34.0
allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true
