services:
  # NestJS Backend API Service
  - type: web
    name: skilex-api
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # API URLs
      - key: API_BASE_URL
        sync: false
      - key: CLIENT_BASE_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      
      # Secrets & Keys
      - key: JWT_SECRET
        generateValue: true
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: INTERNAL_SECRET
        generateValue: true
        
      # Database & Cache
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

      # OAuth Providers
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false

      # Email Provider (Resend)
      - key: ONBOARDING_EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false

      # Video Conferencing (LiveKit)
      - key: NEXT_PUBLIC_LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

      # File Uploads (Cloudflare R2)
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

      # Payments (Flutterwave)
      - key: FLUTTERWAVE_WEBHOOK_SECRET_HASH
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false

      # Exchange Rates
      - key: OER_APP_ID
        sync: false
        
      # Web Push
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false

      # Expo
      - key: EXPO_SCHEME
        sync: false
        
      # PostHog Analytics
      - key: POSTHOG_PROJECT_TOKEN
        sync: false
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
